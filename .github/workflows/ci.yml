name: CI

on:
    pull_request:
    push:
        branches: [master]

permissions: {}

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  cache: true

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22

            - run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm run format:check

            - name: Security audit
              run: pnpm run audit

            - name: Verify package signatures
              run: pnpm run audit:signatures

            - name: Lint
              run: pnpm run lint:check

            - name: Type check
              run: pnpm run type-check

            - name: Unit tests
              run: pnpm run test:unit

            - name: Build
              run: pnpm run build

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: site
                  path: out/
                  retention-days: 1

    terraform-check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
              with:
                  terraform_version: '1.11.4'

            - name: Terraform init
              working-directory: ./static-site
              run: terraform init -backend=false -input=false

            - name: Terraform validate
              working-directory: ./static-site
              run: terraform validate

            - name: Terraform fmt check
              working-directory: ./static-site
              run: terraform fmt -check -diff

            - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
              with:
                  tflint_version: v0.64.0

            - name: TFLint
              working-directory: ./static-site
              run: |
                  tflint --init
                  tflint

            - name: Trivy config scan
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: 'config'
                  scan-ref: 'static-site'
                  scanners: 'misconfig'
                  hide-progress: true
                  format: 'sarif'
                  output: 'trivy-results.sarif'
                  exit-code: '1'

            - name: Upload Trivy results to GitHub Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
              with:
                  sarif_file: 'trivy-results.sarif'

    secrets-scan:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Gitleaks
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    workflow-scan:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: zizmor
              uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
              with:
                  inputs: ./.github/

    e2e:
        runs-on: ubuntu-latest
        needs: check
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  cache: true

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22

            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm run test:e2e

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    lighthouse:
        runs-on: ubuntu-latest
        needs: check
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  cache: true

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22

            - run: pnpm install --frozen-lockfile
            - run: pnpm run build

            - name: Lighthouse CI (informational, does not block merge)
              continue-on-error: true
              run: pnpm run lighthouse

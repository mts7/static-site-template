name: CI

on:
    pull_request:
    push:
        branches: [master]

permissions: {}

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  cache: true

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.nvmrc'

            - run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm run format:check

            - name: Security audit
              run: pnpm run audit

            - name: Verify package signatures
              run: pnpm run audit:signatures

            - name: Lint
              run: pnpm run lint:check

            - name: Type check
              run: pnpm run type-check

            - name: Unit tests
              run: pnpm run test:unit

            - name: Build
              run: pnpm run build

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: site
                  path: out/
                  retention-days: 1

    terraform-check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: '1.16.0'

            - name: Terraform init
              working-directory: ./static-site
              run: terraform init -backend=false -input=false

            - name: Terraform validate
              working-directory: ./static-site
              run: terraform validate

            - name: Terraform fmt check
              working-directory: ./static-site
              run: terraform fmt -check -diff

            - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
              with:
                  tflint_version: v0.64.0

            - name: TFLint
              working-directory: ./static-site
              run: |
                  tflint --init
                  tflint

            - name: Trivy config scan
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: 'config'
                  scan-ref: 'static-site'
                  scanners: 'misconfig'
                  hide-progress: true
                  format: 'sarif'
                  output: 'trivy-results.sarif'
                  exit-code: '1'

            - name: Upload Trivy results to GitHub Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
              with:
                  sarif_file: 'trivy-results.sarif'

    secrets-scan:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Gitleaks
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    workflow-scan:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: zizmor
              uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
              with:
                  inputs: ./.github/

    e2e:
        runs-on: ubuntu-latest
        needs: check
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  cache: true

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.nvmrc'

            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm run test:e2e

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    lighthouse:
        runs-on: ubuntu-latest
        needs: check
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  cache: true

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.nvmrc'

            - run: pnpm install --frozen-lockfile
            - run: pnpm run build

            - name: Lighthouse CI (informational, does not block merge)
              continue-on-error: true
              run: pnpm run lighthouse

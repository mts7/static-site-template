name: Deploy

on:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  cache: true

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22

            - run: pnpm install --frozen-lockfile
            - run: pnpm run format:check
            - run: pnpm run audit
            - run: pnpm run audit:signatures
            - run: pnpm run lint:check
            - run: pnpm run type-check
            - run: pnpm run test:unit
            - run: pnpm run build

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: site
                  path: out/
                  retention-days: 1

    terraform:
        runs-on: ubuntu-latest
        outputs:
            bucket_name: ${{ steps.tf-outputs.outputs.bucket_name }}
            cloudfront_distribution: ${{ steps.tf-outputs.outputs.cloudfront_distribution }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
              with:
                  terraform_version: '1.11.4'

            - name: Terraform init
              working-directory: ./static-site
              run: terraform init

            - name: Terraform validate
              working-directory: ./static-site
              run: terraform validate

            - name: Terraform fmt check
              working-directory: ./static-site
              run: terraform fmt -check

            - name: Terraform plan
              working-directory: ./static-site
              run: terraform plan

            - name: Terraform apply
              working-directory: ./static-site
              run: terraform apply -auto-approve

            - name: Capture outputs
              id: tf-outputs
              working-directory: ./static-site
              run: |
                  echo "bucket_name=$(terraform output -raw bucket_name)" >> "$GITHUB_OUTPUT"
                  echo "cloudfront_distribution=$(terraform output -raw cloudfront_distribution)" >> "$GITHUB_OUTPUT"

    deploy:
        runs-on: ubuntu-latest
        needs: [build, terraform]
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: site
                  path: out

            - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync site to S3
              run: aws s3 sync ./out/ "s3://${NEEDS_TERRAFORM_OUTPUTS_BUCKET_NAME}" --delete
              env:
                  NEEDS_TERRAFORM_OUTPUTS_BUCKET_NAME: ${{ needs.terraform.outputs.bucket_name }}

            - name: Invalidate CloudFront distribution
              run: aws cloudfront create-invalidation --distribution-id "${NEEDS_TERRAFORM_OUTPUTS_CLOUDFRONT_DISTRIBUTION}" --paths "/*"
              env:
                  NEEDS_TERRAFORM_OUTPUTS_CLOUDFRONT_DISTRIBUTION: ${{ needs.terraform.outputs.cloudfront_distribution }}

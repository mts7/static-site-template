name: Deploy

on:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  cache: true

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'

            - run: pnpm install --frozen-lockfile
            - run: pnpm run format:check
            - run: pnpm run audit
            - run: pnpm run audit:signatures
            - run: pnpm run lint:check
            - run: pnpm run type-check
            - run: pnpm run test:unit
            - run: pnpm run build

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: site
                  path: out/
                  retention-days: 1

    terraform:
        runs-on: ubuntu-latest
        outputs:
            bucket_name: ${{ steps.tf-outputs.outputs.bucket_name }}
            cloudfront_distribution: ${{ steps.tf-outputs.outputs.cloudfront_distribution }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: '1.16.0'

            - name: Terraform init
              working-directory: ./static-site
              run: terraform init

            - name: Terraform validate
              working-directory: ./static-site
              run: terraform validate

            - name: Terraform fmt check
              working-directory: ./static-site
              run: terraform fmt -check

            - name: Terraform plan
              working-directory: ./static-site
              run: terraform plan

            - name: Terraform apply
              working-directory: ./static-site
              run: terraform apply -auto-approve

            - name: Capture outputs
              id: tf-outputs
              working-directory: ./static-site
              run: |
                  echo "bucket_name=$(terraform output -raw bucket_name)" >> "$GITHUB_OUTPUT"
                  echo "cloudfront_distribution=$(terraform output -raw cloudfront_distribution)" >> "$GITHUB_OUTPUT"

    deploy:
        runs-on: ubuntu-latest
        needs: [build, terraform]
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: site
                  path: out

            - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync site to S3
              run: aws s3 sync ./out/ "s3://${NEEDS_TERRAFORM_OUTPUTS_BUCKET_NAME}" --delete
              env:
                  NEEDS_TERRAFORM_OUTPUTS_BUCKET_NAME: ${{ needs.terraform.outputs.bucket_name }}

            - name: Invalidate CloudFront distribution
              run: aws cloudfront create-invalidation --distribution-id "${NEEDS_TERRAFORM_OUTPUTS_CLOUDFRONT_DISTRIBUTION}" --paths "/*"
              env:
                  NEEDS_TERRAFORM_OUTPUTS_CLOUDFRONT_DISTRIBUTION: ${{ needs.terraform.outputs.cloudfront_distribution }}
